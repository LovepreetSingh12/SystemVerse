services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: systemverse
      POSTGRES_USER: systemverse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-systemverse}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U systemverse -d systemverse"]
      interval: 5s
      timeout: 5s
      retries: 15
  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/systemverse
      DATABASE_USER: systemverse
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-systemverse}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:80"
volumes:
  postgres_data:
